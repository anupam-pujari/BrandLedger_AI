version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandproof_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - APP_NAME=BrandProof
      - PORT=8000
      - SUPABASE_URL=http://postgres:5432
      - SUPABASE_ANON_KEY=mock-anon-key-local-dev
      - SUPABASE_SERVICE_ROLE_KEY=mock-service-role-key-local-dev
      - JWT_SECRET=dev-jwt-super-secret-key-32charsmin!
      - AI_PROVIDER=local
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brandproof_postgres
    environment:
      - POSTGRES_DB=brandledger
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brandledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
