[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brandproof-backend"
version = "0.1.0"
description = "BrandProof AI — Brand Governance Platform Backend Service"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anupam Pujari", email = "pujarianupam253@gmail.com" },
    { name = "Jnanaranjan Majhi", email = "jnanaranjanmajhi82@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "supabase>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "textstat>=0.7.3",
    "diff-match-patch>=20230430",
    "openai>=1.6.0",
    "google-genai>=0.1.0",
    "Pillow>=10.0.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"

